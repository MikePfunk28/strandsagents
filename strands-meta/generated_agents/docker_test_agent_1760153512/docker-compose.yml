services:
  # Ollama service for model inference
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    command: serve

  # Agent testing service
  agent-test:
    build:
      context: .
      dockerfile: Dockerfile
    image: docker_test_agent_1760153512-agent-test
    ports:
      - "8001:8001"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - TEST_MODE=true
    volumes:
      - ./logs:/app/logs
    command: python -m uvicorn web_interface:app --host 0.0.0.0 --port 8001

volumes:
  ollama_data:
