version: '3.8'

services:
  # Ollama service for model inference
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    command: serve

  # Agent testing service
  agent-test:
    build: .
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - TEST_MODE=true
    volumes:
      - ./logs:/app/logs

  # Optional: Web interface for the agent
  agent-web:
    image: python:3.11-slim
    working_dir: /app
    ports:
      - "8000:8000"
    depends_on:
      - ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
    command: >
      bash -c "
        pip install fastapi uvicorn requests &&
        python -c '
        from fastapi import FastAPI
        import requests

        app = FastAPI()

        @app.get(\"/\")
        async def root():
            return {\"message\": \"Agent API ready\"}

        @app.post(\"/query\")
        async def query_agent(query: str):
            try:
                response = requests.post(\"http://ollama:11434/api/chat\",
                    json={\"model\": \"llama3.2\", \"messages\": [{\"role\": \"user\", \"content\": query}], \"stream\": False})
                result = response.json()
                return {\"response\": result[\"message\"][\"content\"]}
            except Exception as e:
                return {\"error\": str(e)}

        import uvicorn
        uvicorn.run(app, host=\"0.0.0.0\", port=8000)
        '"

volumes:
  ollama_data:
